version: "3.8"

services:
  vinueza:
    image: ghcr.io/mayte256/vinueza:1.0.5

    deploy:
      replicas: 1
      labels:
        - "traefik.enable=true"
        - "traefik.http.routers.vinueza.entrypoints=http"
        - "traefik.http.routers.vinueza.rule=Host(`vinueza.byronrm.com`)"
        - "traefik.http.middlewares.vinueza-https-redirect.redirectscheme.scheme=https"
        - "traefik.http.routers.vinueza.middlewares=vinueza-https-redirect"
        - "traefik.http.routers.vinueza-secure.entrypoints=https"
        - "traefik.http.routers.vinueza-secure.rule=Host(`vinueza.byronrm.com`)"
        - "traefik.http.routers.vinueza-secure.tls=true"
        - "traefik.http.routers.vinueza-secure.tls.certresolver=letsencrypt"
        - "traefik.http.routers.vinueza-secure.service=vinueza"
        - "traefik.http.services.vinueza.loadbalancer.server.port=1003"
        - "traefik.docker.network=traefik-public"

    networks:
      - traefik-public

networks:
  traefik-public:
    external: true
