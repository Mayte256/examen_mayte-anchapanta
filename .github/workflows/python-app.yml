name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]
  pull_request:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Clonar el repositorio
    - name: Checkout code
      uses: actions/checkout@v4

    # 2️⃣ Configurar Python 3.10
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3️⃣ Instalar dependencias y pytest
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install -r stack/requirements.txt
        python -m pip install pytest flake8

    # 4️⃣ Ejecutar tests
    - name: Run tests
      run: python -m pytest stack/test -v

    # 5️⃣ Login en GitHub Container Registry
    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    # 6️⃣ Build y push de la imagen Docker
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./stack
        file: ./stack/Dockerfile
        push: true
        tags: |
          ghcr.io/mayte256/vinueza:1.0.5
          ghcr.io/mayte256/vinueza:latest

    # 7️⃣ Mostrar variables básicas del VPS (solo info)
    - name: Show VPS info
      run: |
        echo "Host: ${{ secrets.VPS_HOST }}"
        echo "User: ${{ secrets.VPS_USER }}"
        echo "SSH Port: ${{ secrets.VPS_SSH_PORT }}"

    # 8️⃣ Probar conexión SSH
    - name: Test SSH connection
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "✅ SSH connection successful"
          hostname
          whoami
          uptime

    # 9️⃣ Copiar stack.yml al VPS
    - name: Copy stack.yml to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        source: "stack/stack.yml"
        target: "/home/${{ secrets.VPS_USER }}/vinueza-deploy/"

    # 🔟 Desplegar stack en VPS
    - name: Deploy stack
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "🔐 Login to GHCR"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          
          echo "📥 Pull Docker image"
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          
          echo "🛑 Remove old stack"
          docker stack rm vinueza || true
          sleep 15
          
          echo "🚀 Deploy new stack"
          cd /home/${{ secrets.VPS_USER }}/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth
          
          echo "✅ Deployment complete"
          docker stack services vinueza
