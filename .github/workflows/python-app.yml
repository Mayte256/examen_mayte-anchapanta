name: CI/CD Vinueza

on:
  push:
    branches: [ "Vinueza" ]
  pull_request:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r stack/requirements.txt

    - name: Run tests
      run: pytest stack/test -v

    - name: Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./stack
        file: ./stack/Dockerfile
        push: true
        tags: ghcr.io/mayte256/vinueza:1.0.5

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USER }}
        password: ${{ secrets.VPS_PASSWORD }}
        port: ${{ secrets.VPS_SSH_PORT }}
        script: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          docker stack rm vinueza || true
          sleep 10
          cd /home/${{ secrets.VPS_USER }}/vinueza-deploy
          docker stack deploy -c stack.yml vinueza --with-registry-auth
          docker stack services vinueza
