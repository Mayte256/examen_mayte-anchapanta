name: Python application - Vinueza

on: 
  push:
    branches: [ "Vinueza" ]
  pull_request:
    branches: [ "Vinueza" ]

permissions:
  contents: read
  packages: write

jobs:
  build-deploy: 
    runs-on: ubuntu-latest

    steps:
    # 1️⃣ Clonar el repo
    - uses: actions/checkout@v4

    # 2️⃣ Configurar Python
    - name: Set up Python 3.10
      uses: actions/setup-python@v3
      with:
        python-version: "3.10"

    # 3️⃣ Instalar dependencias
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f stack/requirements.txt ]; then pip install -r stack/requirements.txt; fi

    # 4️⃣ Lint con flake8
    - name: Lint with flake8
      run: |
        flake8 stack --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 stack --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # 5️⃣ Ejecutar tests
    - name: Run tests
      run: |
        export PYTHONPATH=$PYTHONPATH:./stack
        python -m pytest stack/test -v

    # 6️⃣ Login a GitHub Container Registry
    - name: 🔐 Login to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN }}

    # 7️⃣ Build y push Docker image
    - name: 🏗️ Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: ./stack
        file: ./stack/Dockerfile
        push: true
        tags: ghcr.io/mayte256/vinueza:1.0.5
        labels: |
          org.opencontainers.image.source=https://github.com/Mayte256/examen_mayte-anchapanta
        package-visibility: public

    # 8️⃣ Conectar por SSH al VPS
    - name: 🧪 Test SSH connection
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          echo "✅ Conexión exitosa al VPS"
          hostname
          whoami
          uptime

    # 9️⃣ Copiar stack.yml al VPS
    - name: Copy stack.yml to VPS
      uses: appleboy/scp-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        source: "stack/stack.yml"
        target: "/home/${{ secrets.SSH_USER }}/deploy_vinueza"

    # 🔟 Desplegar stack
    - name: Deploy services
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        password: ${{ secrets.SSH_PASSWORD }}
        port: ${{ secrets.SSH_PORT }}
        script: |
          echo "Desplegando servicios Vinueza"
          cd ~/deploy_vinueza
          echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u mayte256 --password-stdin
          docker pull ghcr.io/mayte256/vinueza:1.0.5
          docker stack rm vinueza || true
          sleep 20
          docker stack deploy -c stack.yml vinueza
          docker service ls
